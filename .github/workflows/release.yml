name: Release Stable Container

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Installs and runs the project's own code, so it gets a read-only token and nothing that can publish.
  verify:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Require the current main commit
        run: |
          git fetch --no-tags --depth=1 origin main
          release_commit="$(git rev-parse 'HEAD^{commit}')"
          main_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "$release_commit" != "$main_commit" ]]; then
            echo "Stable releases must point to the current main commit."
            echo "Release: $release_commit"
            echo "Main:    $main_commit"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - id: version
        name: Validate stable release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable versions must use the form 0.1.0."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version v$version."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build
      - name: Validate container definition
        run: docker build --check .

  # Never runs npm: the image build happens inside BuildKit, which does not see the token.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Require the verified commit
        env:
          VERIFIED_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ -z "$VERIFIED_VERSION" || "$RELEASE_TAG" != "v$VERIFIED_VERSION" ]]; then
            echo "The verified version does not match the release tag."
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # Scanned before anything is pushed, so a public version tag never points at an image that failed the scan.
      - name: Build the image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: srtl-manager:release-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the release image before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: srtl-manager:release-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/srtl-manager
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
      # Provenance and SBOM attestations are attached by BuildKit and need no OIDC token.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Scan the published release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/srtl-manager:${{ needs.verify.outputs.version }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Promote the verified image to latest
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/srtl-manager
        run: docker buildx imagetools create --tag "$IMAGE_REF:latest" "$IMAGE_REF:$VERSION"
